openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List only the authenticated user's saved sessions
      parameters:
        - name: starredOnly
          in: query
          required: false
          schema:
            type: string
            enum: ["true", "false"]
        - name: q
          in: query
          required: false
          description: Case-insensitive literal substring of workout name; surrounding whitespace is ignored.
          schema:
            type: string
            maxLength: 120
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [newest, oldest]
      responses:
        "200":
          description: Matching owned sessions in the requested date order; newest first by default
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkoutSessionRecord"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createSession
      tags: [sessions]
      summary: Save a dated session for the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInput"
      responses:
        "201":
          description: Saved session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutSessionRecord"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getSession
      tags: [sessions]
      summary: Read one of the authenticated user's sessions
      responses:
        "200":
          description: Saved session details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutSessionRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      operationId: updateSession
      tags: [sessions]
      summary: Replace editable session contents atomically, preserving its owner and version link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInput"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutSessionRecord"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: deleteSession
      tags: [sessions]
      summary: Delete an owned session and only its dependent exercise, set, and star rows
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /sessions/{id}/star:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    put:
      operationId: setSessionStar
      tags: [sessions]
      summary: Set or clear a star on an owned session idempotently
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StarPreference"
      responses:
        "200":
          description: Session with its saved star state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutSessionRecord"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get or provision the authenticated user's application account
      description: Requires a valid Clerk session cookie. Identity and verified email are resolved on the server; no user identity is accepted from the client.
      responses:
        "200":
          description: Current application account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUser"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Verified email required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Account service temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  responses:
    Forbidden:
      description: Verified email required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Sign-in required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidInput:
      description: Invalid session data
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Record not found in the authenticated account
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unavailable:
      description: Account or session service temporarily unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    SessionSetInput:
      type: object
      required: [reps]
      properties:
        reps:
          type: integer
          minimum: 0
          maximum: 2147483647
    SessionExerciseInput:
      type: object
      required: [exerciseName, weightLb, sets]
      properties:
        exerciseId:
          type: integer
          minimum: 1
        exerciseName:
          type: string
          minLength: 1
          maxLength: 120
        weightLb:
          type: number
          minimum: 0
          maximum: 99999999.99
          multipleOf: 0.01
        sets:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/SessionSetInput"
    SessionInput:
      type: object
      required: [workoutName, date, notes, exercises]
      properties:
        workoutName:
          type: string
          minLength: 1
          maxLength: 120
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        notes:
          type: [string, "null"]
          maxLength: 5000
        exercises:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/SessionExerciseInput"
    SessionSetRecord:
      type: object
      required: [id, setNumber, reps]
      properties:
        id:
          type: integer
        setNumber:
          type: integer
        reps:
          type: integer
    SessionExerciseRecord:
      type: object
      required: [id, exerciseId, exerciseName, weightLb, position, sets]
      properties:
        id:
          type: integer
        exerciseId:
          type: integer
        exerciseName:
          type: string
        weightLb:
          type: number
        position:
          type: integer
        sets:
          type: array
          items:
            $ref: "#/components/schemas/SessionSetRecord"
    StarPreference:
      type: object
      required: [starred]
      properties:
        starred:
          type: boolean
    WorkoutSessionRecord:
      type: object
      required: [id, workoutVersionId, workoutName, date, notes, exercises, starred]
      properties:
        starred:
          type: boolean
        id:
          type: integer
        workoutVersionId:
          type: [integer, "null"]
        workoutName:
          type: string
        date:
          type: string
        notes:
          type: [string, "null"]
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/SessionExerciseRecord"
    AppUser:
      type: object
      required: [id, authId, email]
      properties:
        id:
          type: string
        authId:
          type: string
        email:
          type: string
          format: email
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        fieldErrors:
          type: object
          description: Optional validation messages keyed by dot-separated SessionInput field paths, such as exercises.0.weightLb or exercises.0.sets.0.reps.
          additionalProperties:
            type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

